name: Tâches quotidiennes (préproduction)

# annona.fr tourne en préversion Vercel : les crons de vercel.json ne s'y exécutent
# pas (ils ne visent que la production Vercel). Ce workflow porte la facturation des
# périodes terminées (FACT-1, /api/cron/billing), avec le même secret que
# cron-operations.yml, à 6 h UTC (7 h ou 8 h à Paris : la veille est terminée).
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cron-daily-preproduction
  cancel-in-progress: false

jobs:
  quotidien:
    name: Factures des périodes terminées
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preproduction
    env:
      PREPROD_BASE_URL: ${{ secrets.PREPROD_BASE_URL }}
      PREPROD_CRON_SECRET: ${{ secrets.PREPROD_CRON_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Vérifier les secrets
        run: |
          missing=0
          for name in PREPROD_BASE_URL PREPROD_CRON_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret GitHub manquant : $name (environnement « preproduction »). Voir docs/OPERATIONS.md."
              missing=1
            fi
          done
          case "$PREPROD_BASE_URL" in
            https://*) ;;
            *) echo "::error::PREPROD_BASE_URL doit commencer par https://"; missing=1 ;;
          esac
          exit "$missing"

      # Les commandes récurrentes sont générées au verrouillage (LOCK-1, cron-lock-orders.yml) : plus d'appel ici.
      - name: Facturer les périodes terminées
        run: |
          url="${PREPROD_BASE_URL%/}/api/cron/billing"
          args=(--silent --show-error --max-time 70 --output response.json --write-out '%{http_code}'
            -H "Authorization: Bearer ${PREPROD_CRON_SECRET}")
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            args+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi
          # FACT-1 (ADM-10) : 503 avec hasMore = lot non vidé, on reprend. La génération est idempotente :
          # un nouvel appel ne refacture aucune commande et ne consomme aucun numéro.
          for attempt in 1 2 3 4 5; do
            status=$(curl "${args[@]}" "$url") || { echo "::error::Appel impossible"; exit 1; }
            echo "Essai $attempt : HTTP $status"
            head -c 500 response.json; echo
            [ "$status" = "200" ] && exit 0
            grep -q '"hasMore":true' response.json && grep -q '"failed":0' response.json || break
          done
          echo "::error::/api/cron/billing a répondu HTTP $status (401 = secret faux ; 503 = échec ou lot non vidé)."
          exit 1
