name: Reprise des tâches de fond (préproduction)

# Filet de sécurité de /api/cron/operations : l'offre Vercel Hobby n'autorise
# qu'un cron par jour, donc la cadence de 5 minutes est portée par GitHub Actions.
# Un workflow planifié ne s'exécute que depuis la branche par défaut du dépôt
# (voir docs/OPERATIONS.md, section « Planificateur des tâches de fond »).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cron-operations-preproduction
  cancel-in-progress: false

jobs:
  reprise:
    name: Appeler /api/cron/operations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # L'environnement GitHub « preproduction » porte les trois secrets et
    # garantit qu'aucune valeur de production n'est utilisée par ce workflow.
    environment: preproduction
    env:
      PREPROD_BASE_URL: ${{ secrets.PREPROD_BASE_URL }}
      PREPROD_CRON_SECRET: ${{ secrets.PREPROD_CRON_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Vérifier les secrets
        run: |
          missing=0
          for name in PREPROD_BASE_URL PREPROD_CRON_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret GitHub manquant : $name (environnement « preproduction »). Voir docs/OPERATIONS.md."
              missing=1
            fi
          done
          case "$PREPROD_BASE_URL" in
            https://*) ;;
            *) echo "::error::PREPROD_BASE_URL doit commencer par https://"; missing=1 ;;
          esac
          exit "$missing"

      - name: Appeler la route de reprise
        run: |
          url="${PREPROD_BASE_URL%/}/api/cron/operations"
          args=(--silent --show-error --max-time 60 --retry 2 --retry-delay 5
            --output response.json --write-out '%{http_code}'
            -H "Authorization: Bearer ${PREPROD_CRON_SECRET}")
          # Protection des déploiements Vercel : « Protection Bypass for Automation ».
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            args+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi
          status=$(curl "${args[@]}" "$url") || { echo "::error::Appel impossible"; exit 1; }
          echo "HTTP $status"
          # Corps de réponse : compteurs uniquement (aucun secret n'y figure).
          head -c 500 response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::/api/cron/operations a répondu HTTP $status (401 = secret faux ; 503 = tâches épuisées ; page de connexion Vercel = bypass manquant)."
            exit 1
          fi
